<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Replacer</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 40px; background: #f4f4f4; }
        .container { max-width: 700px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        input[type="file"] { margin: 15px 0; }
        button { padding: 12px 30px; font-size: 16px; background: #0066ff; color: white; border: none; border-radius: 8px; cursor: pointer; }
        button:hover { background: #0052cc; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖼️ Background Replacer</h1>
        <p>Upload a subject photo and a new background</p>
        
        <form action="/replace" method="post" enctype="multipart/form-data">
            <p><strong>Foreground (Subject):</strong></p>
            <input type="file" name="foreground" accept="image/*" required><br><br>
            
            <p><strong>New Background:</strong></p>
            <input type="file" name="background" accept="image/*" required><br><br>
            
            <button type="submit">Replace Background →</button>
        </form>
        
        <p style="margin-top: 30px; font-size: 0.9em; color: #666;">
            Powered by rembg + Flask • Deployed on Railway
        </p>
    </div>
</body>
</html>
